<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ade80);
      background-size: 200% 200%;
      animation: gradientShift 12s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .profileContainer {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1.2rem;
      padding: 20px 25px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 550px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profileContainer:hover {
      transform: translateY(-5px);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.25);
    }

    .title {
      text-align: center;
      color: #222;
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #333;
    }

    .form-control {
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      border: 1.5px solid #ddd;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #000;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: white;
      color: black;
      border: 2px solid black;
      border-radius: 1rem;
      padding: 8px 20px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: black;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .profilePicContainer {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 10px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profilePic {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
    }

    .profilePic:hover {
      transform: scale(1.08) rotate(2deg);
      border-color: #333;
    }

    .profilePicText {
      position: absolute;
      text-align: center;
      color: black;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
      pointer-events: none;
    }

    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 2px solid black;
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    .back-btn:hover {
      background: white;
      color: black;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .alert {
      border-radius: 10px;
      font-weight: 500;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Back</a>

  <div class="profileContainer">
    <h2 class="title">Edit Profile</h2>

    <div class="profilePicContainer">
      <img src="https://via.placeholder.com/200/667eea/ffffff?text=Profile" class="profilePic" id="profileImage">
      <div class="profilePicText" id="profilePicText">Profile<br>Picture</div>
    </div>

    <form id="profileForm">
      <div id="loadingSpinner" class="text-center mb-2" style="display: none;">
        <div class="spinner-border spinner-border-sm text-dark" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="successAlert" class="alert alert-success" style="display: none;">
        Profile updated successfully!
      </div>

      <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
      <div id="picAlert" class="alert alert-danger" style="display: none;"></div>

      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter Name">

      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter Email">

      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Enter Password">

      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">

      <label for="pic" class="form-label">Change Profile Picture</label>
      <input type="file" class="form-control mb-2" id="pic" accept="image/png, image/jpeg">

      <div class="text-center">
        <button type="submit" class="btn btn-primary">Update Profile</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("profileForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const picInput = document.getElementById("pic");
    const profileImage = document.getElementById("profileImage");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const successAlert = document.getElementById("successAlert");
    const errorAlert = document.getElementById("errorAlert");
    const picAlert = document.getElementById("picAlert");
    const profilePicText = document.getElementById("profilePicText"); // Get the text element

    // Initial state: If the placeholder image is still showing, ensure the text is visible
    // This check is good if the initial src might not always be the placeholder or could be empty
    if (profileImage.src.includes("via.placeholder.com") || profileImage.src === "") {
        profilePicText.style.display = "block";
    } else {
        profilePicText.style.display = "none";
    }


    picInput.addEventListener("change", function (e) {
      const file = e.target.files[0];
      picAlert.style.display = "none";

      if (!file) {
        // If no file is selected (e.g., user opens and cancels the dialog), show the text
        profilePicText.style.display = "block";
        profileImage.src = "https://via.placeholder.com/200/667eea/ffffff?text=Profile"; // Reset to placeholder if needed
        return;
      }

      if (file.type === "image/jpeg" || file.type === "image/png") {
        const reader = new FileReader();
        reader.onload = function (e) {
          profileImage.src = e.target.result;
          profilePicText.style.display = "none"; // Hide the text when an image is loaded
        };
        reader.readAsDataURL(file);
      } else {
        picAlert.textContent = "Only JPEG or PNG files are allowed";
        picAlert.style.display = "block";
        profilePicText.style.display = "block"; // Keep text visible if invalid file
      }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      successAlert.style.display = "none";
      errorAlert.style.display = "none";

      if (passwordInput.value !== confirmPasswordInput.value) {
        errorAlert.textContent = "Passwords do not match";
        errorAlert.style.display = "block";
        return;
      }

      loadingSpinner.style.display = "block";

      setTimeout(() => {
        loadingSpinner.style.display = "none";
        successAlert.style.display = "block";
        passwordInput.value = "";
        confirmPasswordInput.value = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, 1200);
    });
  </script>
</body>
</html>
